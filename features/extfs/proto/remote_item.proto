syntax = "proto3";
package remoteitem;

option go_package = "extfs/remote_item;remoteitem";

message RemoteItemRecordList {
  repeated RemoteItemRecord Items = 1;
}

message RemoteItemRecord{
  uint32 ID = 1;
  int64 CreatedAt = 2;
  int64 UpdatedAt = 3;
  string Name = 4;
  string FileType = 5;
  int64 Size = 6;
  bool Available = 7;
}
  
message RemoteItemRecordSelectCondition {
  optional uint32 ID = 1;
  optional string Name = 2;
}

